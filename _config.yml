# ---------------------------------------------------------------------------
# Site
# ---------------------------------------------------------------------------
title: Akshat Karani
tagline: Engineer at Needl.ai
description: >-
  Akshat Karani is an engineer on the machine learning team at Needl.ai.
  Writing on open source, Google Summer of Code, and software.
url: https://akshatkarani.github.io
baseurl: ""
lang: en_US

# Used by the templates (home page links, footer).
contact:
  email: akshatkarani@gmail.com
  github: akshatkarani
  linkedin: akshat-karani
  x: akshatkarani
resume: /resume.pdf

# ---------------------------------------------------------------------------
# jekyll-seo-tag / jekyll-feed
# ---------------------------------------------------------------------------
author:
  name: Akshat Karani
  url: https://akshatkarani.github.io
  twitter: akshatkarani
twitter:
  username: akshatkarani
  card: summary
social:
  name: Akshat Karani
  links:
    - https://github.com/akshatkarani
    - https://www.linkedin.com/in/akshat-karani
    - https://x.com/akshatkarani

# ---------------------------------------------------------------------------
# Build (GitHub Pages builds this branch directly; keep to its plugin set)
# ---------------------------------------------------------------------------
theme: null                # don't fall back to GitHub Pages' default (Primer) theme
permalink: pretty          # keeps existing post URLs: /YYYY/MM/DD/slug/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    block:
      line_numbers: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/avatar.jpg
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
