{% assign p = site.data.profile %}
<footer class="site-footer">
  <div class="wrap">
    <p>&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}</p>
    <ul>
      <li><a href="https://github.com/{{ p.github }}">GitHub</a></li>
      <li><a href="https://www.linkedin.com/in/{{ p.linkedin }}">LinkedIn</a></li>
      <li><a href="https://x.com/{{ p.x }}">X</a></li>
      <li><a href="mailto:{{ p.email }}">Email</a></li>
      <li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li>
    </ul>
  </div>
</footer>
